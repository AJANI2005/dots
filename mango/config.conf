# Appearance
gappih=4
gappiv=4
gappoh=8
gappov=8
borderpx=2
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# Colors
rootcolor=0x191b20ff
bordercolor=0x30343cff
focuscolor=0x7886a6ff
urgentcolor=0xa66f78ff
globalcolor=0x789a9aff
scratchpadcolor=0x24272eff
overlaycolor=0x788f9aff
maximizescreencolor=0x8f9b78ff

# Startup
exec-once=quickshell
exec-once=xwayland-satellite
exec-once=awww-daemon

# Portals
exec-once=/usr/libexec/xdg-desktop-portal
exec-once=/usr/libexec/xdg-desktop-portal-wlr
exec-once=/usr/libexec/xdg-desktop-portal-gtk

# Clipboard
exec-once=wl-clip-persist --clipboard regular --reconnect-tries 0 &
exec-once=wl-paste --type text --watch cliphist store &

# Env
env=DISPLAY,:0

# Monitors
monitorrule=name:^eDP-1$,width:1920,height:1080,refresh:144,x:0,y:0
monitorrule=name:^HDMI-A-1$,width:1920,height:1080,refresh:60,x:-1920,y:0

# Input
trackpad_natural_scrolling=1

# Show Keybinds
bind=SUPER,K,spawn_shell,foot -a mango_keybinds -e bash -c "$HOME/.config/mango/show-keybinds.sh"

# Apps
bind=SUPER,Return,spawn,foot
bind=SUPER,b,spawn,firefox
bind=SUPER,e,spawn,thunar
bind=SUPER,Space,spawn,fuzzel

# Windows
bind=SUPER,q,killclient
bind=SUPER,w,togglefloating

# Movement (hjkl or arrow keys)
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# Swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,j,exchange_client,down

# Mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Window status
bind=SUPER,g,toggleglobal
bind=ALT,Tab,toggleoverview
bind=SUPER,f,togglemaximizescreen
bind=CTRL+SHIFT,f,togglefakefullscreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER,i,minimized
bind=SUPER+SHIFT,I,restore_minimized

# Scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset

# Layout
circle_layout=tile,scroller
bind=SUPER,t,switch_layout
bind=SUPER,Tab,focusstack,next

# Tags
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Monitor switch
bind=ALT+SHIFT,Left,focusmon,left
bind=ALT+SHIFT,Right,focusmon,right
bind=SUPER+ALT,Left,tagmon,left
bind=SUPER+ALT,Right,tagmon,right

# Gaps
#bind=ALT+SHIFT,X,incgaps,1
#bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# Move window
bind=SUPER+CTRL+SHIFT,Up,movewin,+0,-50
bind=SUPER+CTRL+SHIFT,Down,movewin,+0,+50
bind=SUPER+CTRL+SHIFT,Left,movewin,-50,+0
bind=SUPER+CTRL+SHIFT,Right,movewin,+50,+0

# Resize window
bind=SUPER+CTRL,Up,resizewin,+0,-50
bind=SUPER+CTRL,Down,resizewin,+0,+50
bind=SUPER+CTRL,Left,resizewin,-50,+0
bind=SUPER+CTRL,Right,resizewin,+50,+0

bind=SUPER+CTRL,h,resizewin,-50,+0
bind=SUPER+CTRL,j,resizewin,+0,+50
bind=SUPER+CTRL,k,resizewin,+0,-50
bind=SUPER+CTRL,l,resizewin,+50,+0

# Misc
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,m,quit

# Volume
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 2.0 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Microphone
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle mute

# Media
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioPause,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous

# Brightness
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl -n1 set +10%
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -n1 set 10%-
bind=SHIFT,XF86MonBrightnessUp,spawn,brightnessctl set 100%
bind=SHIFT,XF86MonBrightnessDown,spawn,brightnessctl set 10%

# Screenshot
bind=SUPER,S,spawn_shell,g=$(slurp -d) && [ -n "$g" ] && grim -g "$g" - | satty --filename -
bind=SUPER+SHIFT,S,spawn_shell,f=$HOME/Pictures/Screenshots/$(date +%Y%m%d%H%M%S).png && grim "$f" && firefox "$f"

# Window Rules
windowrule=isfloating:1,appid:mango_keybinds,width:0.8,height:0.8
windowrule=isfloating:1,appid:com.gabm.satty
windowrule=isfloating:1,appid:nmtui,width:0.8,height:0.8
