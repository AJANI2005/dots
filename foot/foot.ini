[main]
font=0xProto Nerd Font:size=16
pad=10x8
term=xterm-256color

[scrollback]
lines=10000

[cursor]
style=beam
blink=yes

[colors]
foreground=cdd6f4
background=111111

regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=cba6f7
regular6=94e2d5
regular7=bac2de

bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=cba6f7
bright6=94e2d5
bright7=a6adc8

selection-foreground=cdd6f4
selection-background=313244

[url]
launch=xdg-open ${url}

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v

[mouse-bindings]
selection-override-modifiers=Shift
